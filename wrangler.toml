name = "pb-draft-off"
main = "src/worker.js"
compatibility_date = "2025-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/d/*", "/api/*"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[durable_objects.bindings]]
name = "DRAFTS"
class_name = "Draft"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Draft", "Limiter"]

[observability]
enabled = false
